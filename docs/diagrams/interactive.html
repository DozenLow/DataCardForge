<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataCardForge · 设计记录图（交互版）</title>
<meta name="description" content="docs/diagrams 的交互增件：决策流向、端口投影、当前架构三张图，可切换中英与主题，点选节点查看来龙去脉。">
<style>
  :root {
    --bg: #ffffff;
    --fg: #0f172a;
    --muted: #64748b;
    --card: #f8fafc;
    --line: #e2e8f0;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e2e8f0;
      --muted: #94a3b8;
      --card: #161b22;
      --line: #30363d;
      --accent: #60a5fa;
      --accent-soft: #1e3a8a;
      color-scheme: dark;
    }
  }
  html[data-theme="light"] {
    --bg: #ffffff; --fg: #0f172a; --muted: #64748b; --card: #f8fafc;
    --line: #e2e8f0; --accent: #2563eb; --accent-soft: #dbeafe; color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: #0d1117; --fg: #e2e8f0; --muted: #94a3b8; --card: #161b22;
    --line: #30363d; --accent: #60a5fa; --accent-soft: #1e3a8a; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header { max-width: 1200px; margin: 0 auto 20px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .hint { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .hint code { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }

  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  [role="tablist"] { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 13px; cursor: pointer;
    color: var(--fg); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px;
  }
  button:hover { border-color: var(--accent); }
  button[aria-selected="true"], button[aria-pressed="true"] {
    background: var(--accent-soft); border-color: var(--accent); color: var(--fg); font-weight: 600;
  }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .toggles { display: flex; gap: 6px; }

  main { max-width: 1200px; margin: 0 auto; display: grid; gap: 20px; grid-template-columns: 1fr; }
  @media (min-width: 1080px) {
    main { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
  }

  .figure {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; overflow-x: auto;
  }
  .figure img, .figure svg { display: block; width: 100%; height: auto; max-width: 1100px; }
  .figure svg .node-group, .figure svg .stage { cursor: pointer; }
  .figure svg g:focus { outline: none; }
  .figure svg g:focus-visible { outline: 2px dashed var(--accent); outline-offset: 4px; }
  .figure svg.is-focused .node-group { opacity: .4; transition: opacity .15s ease; }
  .figure svg.is-focused .node-group.is-on { opacity: 1; }
  .figure svg.is-focused path[data-from] { opacity: .2; transition: opacity .15s ease; }
  .figure svg.is-focused path[data-from].is-on { opacity: 1; stroke-width: 2.75; }
  .figure svg .stage.is-on rect { stroke-width: 3.25; }
  .note { margin: 12px 0 0; font-size: 12.5px; color: var(--muted); }
  .note[hidden] { display: none; }

  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; min-height: 120px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 4px; }
  .panel .when { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
  .panel p { margin: 0 0 10px; font-size: 13.5px; }
  .panel ul { margin: 0 0 12px; padding-left: 18px; font-size: 13.5px; }
  .panel li { margin-bottom: 6px; }
  .panel .empty { color: var(--muted); font-size: 13.5px; margin: 0; }
  .panel .src { font-size: 13px; }
  .panel .src a { color: var(--accent); text-decoration: none; }
  .panel .src a:hover { text-decoration: underline; }
  .panel .src li { margin-bottom: 4px; }
  footer { max-width: 1200px; margin: 24px auto 0; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>DataCardForge · 设计记录图</h1>
  <p class="hint">
    本页是 <code>docs/diagrams/*.svg</code> 的交互增件，权威内容仍是各篇 <code>.md</code>。
    点图里的阶段块或组件可看它的来龙去脉。
  </p>
  <div class="controls">
    <div role="tablist" aria-label="选择图">
      <button role="tab" aria-selected="true" data-diagram="decision-flow">决策流向</button>
      <button role="tab" aria-selected="false" data-diagram="port-projection">端口投影</button>
      <button role="tab" aria-selected="false" data-diagram="architecture">当前架构</button>
    </div>
    <div class="toggles">
      <button id="lang" aria-pressed="false" title="切换中英文">EN</button>
      <button id="theme" title="切换主题">主题：自动</button>
    </div>
  </div>
</header>

<main>
  <div id="figure" class="figure" role="tabpanel" aria-live="polite"></div>
  <aside id="panel" class="panel" aria-live="polite">
    <p class="empty">点选图中的阶段或组件，这里显示它当时的判断、留下的坑与出处。</p>
  </aside>
</main>

<footer>
  图源：<code>decision-flow</code> / <code>port-projection</code> / <code>architecture</code> 的
  <code>.zh.svg</code> 与 <code>.en.svg</code>。中文为原版。
</footer>

  const figure = document.getElementById('figure');
  const panel = document.getElementById('panel');
  const langBtn = document.getElementById('lang');
  const themeBtn = document.getElementById('theme');
  const tabButtons = [...document.querySelectorAll('[data-diagram]')];

  let svgStyleOriginal = '';
  let svgStyleWithoutMedia = '';
  let darkVars = {};
  let selected = null;

  const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  // 只转义纯文本，<code> 由调用方保证安全（本项目内部常量）。
  const rich = (s) => s.replace(/<code>(.*?)<\/code>/g, (_, t) => `<code>${escapeHtml(t)}</code>`)
    .replace(/&(?!(amp|lt|gt|quot|#39);)/g, '&amp;');

  function splitSvgStyle(text) {
    const at = text.indexOf('@media');
    if (at < 0) return { original: text, without: text, dark: {} };
    let depth = 0, end = -1;
    const open = text.indexOf('{', at);
    for (let i = open; i < text.length; i++) {
      if (text[i] === '{') depth += 1;
      else if (text[i] === '}') {
        depth -= 1;
        if (depth === 0) { end = i + 1; break; }
      }
    }
    if (end < 0) return { original: text, without: text, dark: {} };
    const block = text.slice(at, end);
    const dark = {};
    for (const m of block.matchAll(/(--[\w-]+)\s*:\s*([^;]+);/g)) dark[m[1]] = m[2].trim();
    return { original: text, without: text.slice(0, at) + text.slice(end), dark };
  }

  function clearVars(svg) {
    for (const key of Object.keys(darkVars)) svg.style.removeProperty(key);
  }

  function applySvgTheme() {
    const svg = figure.querySelector('svg');
    if (!svg) return;
    const styleEl = svg.querySelector('style');
    if (state.theme === 'auto') {
      if (styleEl && svgStyleOriginal) styleEl.textContent = svgStyleOriginal;
      clearVars(svg);
      return;
    }
    if (styleEl) styleEl.textContent = svgStyleWithoutMedia;
    if (state.theme === 'dark') {
      for (const [k, v] of Object.entries(darkVars)) svg.style.setProperty(k, v);
    } else {
      clearVars(svg);
    }
  }

  function setTheme(theme) {
    state.theme = theme;
    document.documentElement.dataset.theme = theme;
    const labels = state.lang === 'zh' ? THEME_LABEL : THEME_LABEL_EN;
    themeBtn.textContent = labels[theme];
    themeBtn.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
    applySvgTheme();
  }

  function paintSelection() {
    const svg = figure.querySelector('svg');
    if (!svg) return;
    svg.classList.toggle('is-focused', Boolean(selected));
    for (const g of svg.querySelectorAll('.node-group, .stage')) {
      g.classList.toggle('is-on', g.dataset.id === selected || g.id === selected);
    }
    for (const path of svg.querySelectorAll('path[data-from]')) {
      path.classList.toggle('is-on', Boolean(selected)
        && (path.dataset.from === selected || path.dataset.to === selected));
    }
  }

  function showDetails(id) {
    const map = DETAILS[state.diagram] && DETAILS[state.diagram][state.lang];
    const item = map && map[id];
    if (!item) {
      selected = null;
      paintSelection();
      panel.innerHTML = `<p class="empty">${escapeHtml(EMPTY[state.lang])}</p>`;
      return;
    }
    selected = id;
    paintSelection();
    const points = item.points.map((p) => `<li>${rich(p)}</li>`).join('');
    const sources = item.sources
      .map(([label, href]) => `<li><a href="${href}">${escapeHtml(label)}</a></li>`)
      .join('');
    panel.innerHTML = `
      <h2>${escapeHtml(item.title)}</h2>
      <ul>${points}</ul>
      <div class="src"><strong>${state.lang === 'zh' ? '出处' : 'Sources'}</strong>
        <ul>${sources}</ul>
      </div>`;
    if (window.matchMedia('(max-width: 1079px)').matches) {
      panel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  function wireDiagram(svg) {
    const map = DETAILS[state.diagram] && DETAILS[state.diagram][state.lang];
    if (!map || !Object.keys(map).length) return;
    for (const g of svg.querySelectorAll('.node-group, .stage')) {
      const id = g.dataset.id || g.id;
      if (!id || !map[id]) continue;
      g.setAttribute('tabindex', '0');
      g.setAttribute('role', 'button');
      g.setAttribute('aria-label', map[id].title);
      g.addEventListener('click', () => showDetails(id));
      g.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          showDetails(id);
        }
      });
    }
  }

  async function load() {
    selected = null;
    const name = `${state.diagram}.${LETTERS[state.lang]}.svg`;
    const alt = state.lang === 'zh' ? '设计记录图（中文）' : 'Design record diagram (English)';
    figure.innerHTML = `<img src="${name}" alt="${alt}">`;
    svgStyleOriginal = svgStyleWithoutMedia = '';
    darkVars = {};
    try {
      const res = await fetch(name, { cache: 'no-cache' });
      if (!res.ok) throw new Error(String(res.status));
      const text = await res.text();
      figure.innerHTML = text;
      const svg = figure.querySelector('svg');
      if (!svg) throw new Error('no <svg>');
      svg.removeAttribute('width');
      svg.removeAttribute('height');
      const styleEl = svg.querySelector('style');
      if (styleEl) {
        const parts = splitSvgStyle(styleEl.textContent);
        svgStyleOriginal = parts.original;
        svgStyleWithoutMedia = parts.without;
        darkVars = parts.dark;
      }
      applySvgTheme();
      wireDiagram(svg);
    } catch {
      // file:// 下 fetch 会被拦，静态 <img> 仍可用 —— 给出可读的提示即可。
      const note = document.createElement('p');
      note.className = 'note';
      note.textContent = state.lang === 'zh'
        ? '当前是静态图。用本地服务器打开本页（例如在 docs/diagrams 下跑 python3 -m http.server）即可启用点选交互。'
        : 'Static image. Serve this page over HTTP (e.g. python3 -m http.server in docs/diagrams) to enable click-to-inspect.';
      figure.appendChild(note);
    }
    showDetails(null);
  }

  function setLang(lang) {
    state.lang = lang;
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    langBtn.textContent = lang === 'zh' ? 'EN' : '中文';
    langBtn.setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
    for (const btn of tabButtons) {
      btn.textContent = TABS[lang][btn.dataset.diagram];
    }
    themeBtn.textContent = (lang === 'zh' ? THEME_LABEL : THEME_LABEL_EN)[state.theme];
    load();
  }

  for (const btn of tabButtons) {
    btn.addEventListener('click', () => {
      state.diagram = btn.dataset.diagram;
      for (const other of tabButtons) {
        other.setAttribute('aria-selected', other === btn ? 'true' : 'false');
      }
      load();
    });
    btn.addEventListener('keydown', (ev) => {
      const i = tabButtons.indexOf(btn);
      const next = ev.key === 'ArrowRight' ? tabButtons[(i + 1) % tabButtons.length]
        : ev.key === 'ArrowLeft' ? tabButtons[(i - 1 + tabButtons.length) % tabButtons.length]
        : null;
      if (next) { ev.preventDefault(); next.focus(); next.click(); }
    });
  }

  langBtn.addEventListener('click', () => setLang(state.lang === 'zh' ? 'en' : 'zh'));
  themeBtn.addEventListener('click', () => {
    const order = ['auto', 'light', 'dark'];
    setTheme(order[(order.indexOf(state.theme) + 1) % order.length]);
  });

  setLang('zh');
  setTheme('auto');
})();
</script>
</body>
</html>
