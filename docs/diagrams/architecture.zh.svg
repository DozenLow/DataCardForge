<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" width="960" height="672" role="img" aria-labelledby="dca-title dca-desc">
  <title id="dca-title">DataCardForge 当前架构：前端纯交互，计算全在后端</title>
  <desc id="dca-desc">浏览器与 Web Worker 组成只做交互的前端；拖入的数据文件由 Worker 解析。浏览器通过协议 v1（JSON 控制面 + DCM2 矩阵帧）访问后端服务，后端服务调度表达式引擎与依赖图，读写矩阵存储，并把节点状态通过长轮询事件流推回浏览器驱动四态指示灯。</desc>

  <style>
    text { font-family: 'Noto Sans SC', 'Noto Sans CJK SC', 'Source Han Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .region-label { font-size: 12px; font-weight: 600; fill: var(--dca-muted, #64748b); }
    .title { font-size: 13.5px; font-weight: 600; fill: var(--dca-ink, #0f172a); }
    .sub { font-size: 12px; font-weight: 400; fill: var(--dca-text, #475569); }
    .edge-label { font-size: 11.5px; font-weight: 400; fill: var(--dca-muted, #64748b); }
    .region { fill: none; stroke: var(--dca-region-line, #cbd5e1); stroke-width: 1.25; stroke-dasharray: 6 5; rx: 14; }
    .node { stroke-width: 1.5; rx: 10; }
    .ext { fill: var(--dca-ext-bg, #f8fafc); stroke: var(--dca-ext-line, #94a3b8); stroke-dasharray: 5 4; }
    .fe { fill: var(--dca-fe-bg, #eff6ff); stroke: var(--dca-fe-line, #3b82f6); }
    .fe2 { fill: var(--dca-fe2-bg, #f0f9ff); stroke: var(--dca-fe2-line, #38bdf8); }
    .be { fill: var(--dca-be-bg, #ecfdf5); stroke: var(--dca-be-line, #059669); }
    .be2 { fill: var(--dca-be2-bg, #f0fdf4); stroke: var(--dca-be2-line, #10b981); }
    .be3 { fill: var(--dca-be3-bg, #f5f3ff); stroke: var(--dca-be3-line, #8b5cf6); }
    .solid { fill: none; stroke: var(--dca-edge, #64748b); stroke-width: 1.75; }
    .dashed { fill: none; stroke: var(--dca-edge-soft, #94a3b8); stroke-width: 1.5; stroke-dasharray: 5 4; }

    @media (prefers-color-scheme: dark) {
      :root {
        --dca-ink: #e2e8f0;
        --dca-text: #cbd5e1;
        --dca-muted: #94a3b8;
        --dca-region-line: #334155;
        --dca-ext-bg: #111827; --dca-ext-line: #64748b;
        --dca-fe-bg: #172554; --dca-fe-line: #60a5fa;
        --dca-fe2-bg: #0c2f4a; --dca-fe2-line: #38bdf8;
        --dca-be-bg: #052e2b; --dca-be-line: #34d399;
        --dca-be2-bg: #062e21; --dca-be2-line: #10b981;
        --dca-be3-bg: #2e1065; --dca-be3-line: #a78bfa;
        --dca-edge: #94a3b8;
        --dca-edge-soft: #64748b;
      }
    }
  </style>

  <defs>
    <marker id="dca-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--dca-edge, #64748b)"/>
    </marker>
    <marker id="dca-arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--dca-edge-soft, #94a3b8)"/>
    </marker>
  </defs>

  <!-- 区域 -->
  <rect class="region" x="24" y="180" width="476" height="270"/>
  <text class="region-label" x="496" y="170" text-anchor="end">前端（web/）</text>
  <rect class="region" x="590" y="180" width="350" height="470"/>
  <text class="region-label" x="936" y="170" text-anchor="end">计算后端（backend/）</text>

  <!-- 外部 -->
  <g class="node-group" id="n-user">
    <rect class="node ext" x="290" y="16" width="190" height="56"/>
    <text class="title" x="385" y="40" text-anchor="middle">用户</text>
    <text class="sub" x="385" y="59" text-anchor="middle">操作者</text>
  </g>

  <g class="node-group" id="n-files">
    <rect class="node ext" x="34" y="104" width="190" height="64"/>
    <text class="title" x="129" y="128" text-anchor="middle">数据文件</text>
    <text class="sub" x="129" y="148" text-anchor="middle">TXT · CSV · TSV · DAT · XLSX</text>
  </g>

  <!-- 前端节点 -->
  <g class="node-group" id="n-worker">
    <rect class="node fe2" x="44" y="260" width="170" height="130"/>
    <text class="title" x="60" y="284">Web Worker</text>
    <text class="sub" x="60" y="308">文件解析 · 免冻结</text>
    <text class="sub" x="60" y="330">无 Worker 回退主线程</text>
  </g>

  <g class="node-group" id="n-browser">
    <rect class="node fe" x="286" y="240" width="194" height="170"/>
    <text class="title" x="302" y="264">浏览器 · React 19</text>
    <text class="sub" x="302" y="288">ECharts 6 · zustand</text>
    <text class="sub" x="302" y="310">VirtualTable 虚拟滚动</text>
    <text class="sub" x="302" y="332">卡片 · 端口 · 连线 · 四态灯</text>
    <text class="sub" x="302" y="354">纯交互 —— 不做数值计算</text>
  </g>

  <!-- 后端节点 -->
  <g class="node-group" id="n-service">
    <rect class="node be" x="608" y="230" width="314" height="110"/>
    <text class="title" x="624" y="254">后端服务（HTTP）</text>
    <text class="sub" x="624" y="278">协议 v1 控制面 · 静态托管 web/</text>
    <text class="sub" x="624" y="300">DCM2 矩阵帧（窗口 + 整表形状）</text>
    <text class="sub" x="624" y="322">端口 37811 · --web-root 自动探测</text>
  </g>

  <g class="node-group" id="n-engine">
    <rect class="node be2" x="608" y="374" width="314" height="110"/>
    <text class="title" x="624" y="398">表达式引擎 · 依赖图</text>
    <text class="sub" x="624" y="422">求值 · 级联重算 · 成环拒绝</text>
    <text class="sub" x="624" y="444">dirty → computing → done | error</text>
    <text class="sub" x="624" y="466">FunctionSignature 注册表 · K 输出</text>
  </g>

  <g class="node-group" id="n-store">
    <rect class="node be3" x="608" y="518" width="314" height="110"/>
    <text class="title" x="624" y="542">矩阵存储</text>
    <text class="sub" x="624" y="566">数据 / 依赖图 / 计算定义的权威副本</text>
    <text class="sub" x="624" y="588">列式矩阵：行 = 样本，列 = 变量</text>
    <text class="sub" x="624" y="610">浏览器只留按 revision 键控的只读缓存</text>
  </g>

  <!-- 连线 -->
  <path class="solid" d="M385 72 V 232" data-from="n-user" data-to="n-browser" marker-end="url(#dca-arrow)"/>

  <path class="solid" d="M129 168 V 252" data-from="n-files" data-to="n-worker" marker-end="url(#dca-arrow)"/>
  <text class="edge-label" x="141" y="196">拖入 / 打开</text>

  <path class="solid" d="M214 325 H 280" data-from="n-worker" data-to="n-browser" marker-end="url(#dca-arrow)"/>
  <text class="edge-label" x="247" y="317" text-anchor="middle">解析注册</text>

  <path class="solid" d="M480 300 H 600" data-from="n-browser" data-to="n-service" marker-end="url(#dca-arrow)"/>
  <text class="edge-label" x="540" y="292" text-anchor="middle">JSON · DCM2</text>

  <path class="dashed" d="M608 372 H 482" data-from="n-service" data-to="n-browser" marker-end="url(#dca-arrow-soft)"/>
  <text class="edge-label" x="548" y="390" text-anchor="middle">长轮询事件流</text>

  <path class="solid" d="M765 340 V 366" data-from="n-service" data-to="n-engine" marker-end="url(#dca-arrow)"/>
  <text class="edge-label" x="777" y="358">调度求值</text>

  <path class="solid" d="M765 484 V 510" data-from="n-engine" data-to="n-store" marker-end="url(#dca-arrow)"/>
  <text class="edge-label" x="777" y="502">读写矩阵结果</text>
</svg>
