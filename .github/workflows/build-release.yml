name: Build and Release Executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        type: choice
        description: 'Select platform(s) to build'
        default: 'all'
        options:
          - all
          - linux-only
          - macos-only
          - windows-only
      build_type:
        type: choice
        description: 'Build type'
        default: 'Release'
        options:
          - Release
          - Debug
          - both

jobs:
  build-linux-release:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'linux')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libeigen3-dev

      - name: Configure backend (Release)
        run: cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build backend
        run: cmake --build backend/build --config Release

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-linux-Release
          path: backend/build/dc_backend
          if-no-files-found: error

  build-linux-debug:
    runs-on: ubuntu-latest
    if: |
      (github.event_name != 'workflow_dispatch' ||
       contains(github.event.inputs.platforms, 'all') ||
       contains(github.event.inputs.platforms, 'linux')) &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.build_type == 'both' ||
       github.event.inputs.build_type == 'Debug')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libeigen3-dev

      - name: Configure backend (Debug)
        run: cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build backend
        run: cmake --build backend/build --config Debug

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-linux-Debug
          path: backend/build/dc_backend
          if-no-files-found: error

  build-macos-release:
    runs-on: macos-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'macos')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: brew install cmake ninja eigen@3

      - name: Configure backend (Release)
        run: cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix eigen@3)"

      - name: Build backend
        run: cmake --build backend/build --config Release

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-macos-Release
          path: backend/build/dc_backend
          if-no-files-found: error

  build-macos-debug:
    runs-on: macos-latest
    if: |
      (github.event_name != 'workflow_dispatch' ||
       contains(github.event.inputs.platforms, 'all') ||
       contains(github.event.inputs.platforms, 'macos')) &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.build_type == 'both' ||
       github.event.inputs.build_type == 'Debug')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: brew install cmake ninja eigen@3

      - name: Configure backend (Debug)
        run: cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$(brew --prefix eigen@3)"

      - name: Build backend
        run: cmake --build backend/build --config Debug

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-macos-Debug
          path: backend/build/dc_backend
          if-no-files-found: error

  build-windows-release:
    runs-on: windows-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'windows')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cmake and ninja
        run: choco install cmake ninja -y

      - name: Install Eigen
        run: |
          vcpkg install eigen3:x64-windows
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = $env:VCPKG_ROOT }
          if (-not $vcpkgRoot) { $vcpkgRoot = Split-Path -Parent (Get-Command vcpkg).Source }
          echo "CMAKE_TOOLCHAIN_FILE=$vcpkgRoot\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure backend (Release)
        run: cmake -S backend -B backend/build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${{ env.CMAKE_TOOLCHAIN_FILE }}"

      - name: Build backend
        run: cmake --build backend/build --config Release

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-windows-Release
          path: backend/build/dc_backend.exe
          if-no-files-found: error

  build-windows-debug:
    runs-on: windows-latest
    if: |
      (github.event_name != 'workflow_dispatch' ||
       contains(github.event.inputs.platforms, 'all') ||
       contains(github.event.inputs.platforms, 'windows')) &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.build_type == 'both' ||
       github.event.inputs.build_type == 'Debug')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cmake and ninja
        run: choco install cmake ninja -y

      - name: Install Eigen
        run: |
          vcpkg install eigen3:x64-windows
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = $env:VCPKG_ROOT }
          if (-not $vcpkgRoot) { $vcpkgRoot = Split-Path -Parent (Get-Command vcpkg).Source }
          echo "CMAKE_TOOLCHAIN_FILE=$vcpkgRoot\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure backend (Debug)
        run: cmake -S backend -B backend/build -G "Ninja" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE="${{ env.CMAKE_TOOLCHAIN_FILE }}"

      - name: Build backend
        run: cmake --build backend/build --config Debug

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-windows-Debug
          path: backend/build/dc_backend.exe
          if-no-files-found: error

  release:
    needs: [build-linux-release, build-linux-debug, build-macos-release, build-macos-debug, build-windows-release, build-windows-debug]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cd artifacts
          for dir in */; do
            dir_name="${dir%/}"
            if [ -f "$dir_name/dc_backend" ]; then
              zip -j ../release/"${dir_name}.zip" "$dir_name/dc_backend"
            elif [ -f "$dir_name/dc_backend.exe" ]; then
              zip -j ../release/"${dir_name}.zip" "$dir_name/dc_backend.exe"
            fi
          done

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          version=${GITHUB_REF#refs/tags/v}
          # Extract notes between version header and next version or EOF
          changelog_notes=$(awk "/## \[$version\]/,/## \[/{if(!/## \[/) print}" CHANGELOG.md)
          
          # Handle multiline content for GitHub Actions
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$changelog_notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
