name: Build and Release Executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for build sha script

      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libeigen3-dev

      - name: Configure backend (${{ matrix.build-type }})
        run: cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

      - name: Build backend
        run: cmake --build backend/build --config ${{ matrix.build-type }}

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-linux-${{ matrix.build-type }}
          path: backend/build/dc_backend
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        build-type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: brew install cmake ninja eigen

      - name: Configure backend (${{ matrix.build-type }})
        run: cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

      - name: Build backend
        run: cmake --build backend/build --config ${{ matrix.build-type }}

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-macos-${{ matrix.build-type }}
          path: backend/build/dc_backend
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        build-type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cmake and ninja
        run: choco install cmake ninja -y

      - name: Install Eigen
        run: |
          vcpkg install eigen3:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_INSTALLATION_ROOT }}\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure backend (${{ matrix.build-type }})
        run: cmake -S backend -B backend/build -G "Ninja" -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_TOOLCHAIN_FILE="${{ env.CMAKE_TOOLCHAIN_FILE }}"

      - name: Build backend
        run: cmake --build backend/build --config ${{ matrix.build-type }}

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-windows-${{ matrix.build-type }}
          path: backend/build/dc_backend.exe
          if-no-files-found: error

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cd artifacts
          for dir in */; do
            dir_name="${dir%/}"
            if [ -f "$dir_name/dc_backend" ]; then
              zip -j ../release/"${dir_name}.zip" "$dir_name/dc_backend"
            elif [ -f "$dir_name/dc_backend.exe" ]; then
              zip -j ../release/"${dir_name}.zip" "$dir_name/dc_backend.exe"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
