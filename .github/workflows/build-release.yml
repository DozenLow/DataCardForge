name: Build and Release Executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        type: choice
        description: 'Select platform(s) to build'
        default: 'all'
        options:
          - all
          - linux-only
          - macos-only
          - windows-only
      build_type:
        type: choice
        description: 'Build type'
        default: 'Release'
        options:
          - Release
          - Debug
          - both

permissions:
  contents: read

concurrency:
  # A branch that is pushed twice must not queue the old commit's six builds.
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    # The packaged experience is binary + web/ in one zip, so the front end is built here
    # rather than asking the user to install Node.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build front end
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build-linux-perf:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'linux')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libeigen3-dev

      - name: Configure backend (Release)
        run: >
          cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build backend
        run: cmake --build backend/build --config Release

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Check runtime dependencies
        run: ldd backend/build/dc_backend || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-linux-perf
          path: backend/build/dc_backend
          if-no-files-found: error

  build-linux-debug:
    runs-on: ubuntu-latest
    # Debug exists so a user can hand back a build that stops at the first violated contract.
    # That job does not need to gate every commit — tags are enough.
    if: |
      (github.event_name != 'workflow_dispatch' ||
       contains(github.event.inputs.platforms, 'all') ||
       contains(github.event.inputs.platforms, 'linux')) &&
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libeigen3-dev

      - name: Configure backend (Debug)
        run: cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build backend
        run: cmake --build backend/build --config Debug

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-linux-debug
          path: backend/build/dc_backend
          if-no-files-found: error

  build-macos-perf:
    runs-on: macos-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'macos')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: brew install cmake ninja eigen@3

      - name: Configure backend (Release)
        run: cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix eigen@3)"

      - name: Build backend
        run: cmake --build backend/build --config Release

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-macos-perf
          path: backend/build/dc_backend
          if-no-files-found: error

  build-macos-debug:
    runs-on: macos-latest
    if: |
      (github.event_name != 'workflow_dispatch' ||
       contains(github.event.inputs.platforms, 'all') ||
       contains(github.event.inputs.platforms, 'macos')) &&
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: brew install cmake ninja eigen@3

      - name: Configure backend (Debug)
        run: cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$(brew --prefix eigen@3)"

      - name: Build backend
        run: cmake --build backend/build --config Debug

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-macos-debug
          path: backend/build/dc_backend
          if-no-files-found: error

  build-windows-perf:
    runs-on: windows-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'windows')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cmake and ninja
        run: choco install cmake ninja -y

      - name: Install Eigen
        run: |
          vcpkg install eigen3:x64-windows
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = $env:VCPKG_ROOT }
          if (-not $vcpkgRoot) { $vcpkgRoot = Split-Path -Parent (Get-Command vcpkg).Source }
          echo "CMAKE_TOOLCHAIN_FILE=$vcpkgRoot\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure backend (Release)
        run: cmake -S backend -B backend/build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_TOOLCHAIN_FILE="${{ env.CMAKE_TOOLCHAIN_FILE }}"

      - name: Build backend
        run: cmake --build backend/build --config Release

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-windows-perf
          path: backend/build/dc_backend.exe
          if-no-files-found: error

  build-windows-debug:
    runs-on: windows-latest
    if: |
      (github.event_name != 'workflow_dispatch' ||
       contains(github.event.inputs.platforms, 'all') ||
       contains(github.event.inputs.platforms, 'windows')) &&
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cmake and ninja
        run: choco install cmake ninja -y

      - name: Install Eigen
        run: |
          vcpkg install eigen3:x64-windows
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = $env:VCPKG_ROOT }
          if (-not $vcpkgRoot) { $vcpkgRoot = Split-Path -Parent (Get-Command vcpkg).Source }
          echo "CMAKE_TOOLCHAIN_FILE=$vcpkgRoot\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure backend (Debug)
        run: cmake -S backend -B backend/build -G "Ninja" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE="${{ env.CMAKE_TOOLCHAIN_FILE }}"

      - name: Build backend
        run: cmake --build backend/build --config Debug

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-windows-debug
          path: backend/build/dc_backend.exe
          if-no-files-found: error

  build-linux-standard:
    # The recommended download: optimized (-O2) with NDEBUG left undefined, so Eigen's
    # assertions stay on. Same binary the tests measure, minus the "silently wrong number".
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'linux')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libeigen3-dev

      - name: Configure backend (Asserts)
        run: >
          cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Asserts
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build backend
        run: cmake --build backend/build

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-linux-standard
          path: backend/build/dc_backend
          if-no-files-found: error

  build-macos-standard:
    runs-on: macos-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'macos')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: brew install cmake ninja eigen@3

      - name: Configure backend (Asserts)
        run: cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Asserts -DCMAKE_PREFIX_PATH="$(brew --prefix eigen@3)"

      - name: Build backend
        run: cmake --build backend/build

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-macos-standard
          path: backend/build/dc_backend
          if-no-files-found: error

  build-windows-standard:
    runs-on: windows-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'windows')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cmake and ninja
        run: choco install cmake ninja -y

      - name: Install Eigen
        run: |
          vcpkg install eigen3:x64-windows
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = $env:VCPKG_ROOT }
          if (-not $vcpkgRoot) { $vcpkgRoot = Split-Path -Parent (Get-Command vcpkg).Source }
          echo "CMAKE_TOOLCHAIN_FILE=$vcpkgRoot\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure backend (Asserts)
        run: cmake -S backend -B backend/build -G "Ninja" -DCMAKE_BUILD_TYPE=Asserts -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_TOOLCHAIN_FILE="${{ env.CMAKE_TOOLCHAIN_FILE }}"

      - name: Build backend
        run: cmake --build backend/build

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dc_backend-windows-standard
          path: backend/build/dc_backend.exe
          if-no-files-found: error

  release:
    needs:
      - build-web
      - build-linux-standard
      - build-linux-perf
      - build-linux-debug
      - build-macos-standard
      - build-macos-perf
      - build-macos-debug
      - build-windows-standard
      - build-windows-perf
      - build-windows-debug
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in artifacts/*/; do
            dir_name="$(basename "$dir")"
            [ "$dir_name" = "web-dist" ] && continue
            bin=""
            [ -f "$dir/dc_backend" ] && bin="$dir/dc_backend"
            [ -f "$dir/dc_backend.exe" ] && bin="$dir/dc_backend.exe"
            [ -n "$bin" ] || continue
            # Layout the binary auto-detects: <exe dir>/web/index.html. Staging first keeps
            # the zip's root tidy and makes the "unzip and run" path work with no flags.
            stage="$RUNNER_TEMP/stage/$dir_name"
            rm -rf "$stage"
            mkdir -p "$stage/web"
            cp "$bin" "$stage/"
            cp -r artifacts/web-dist/. "$stage/web/"
            ( cd "$stage" && zip -q -r "$GITHUB_WORKSPACE/release/${dir_name}.zip" . )
          done
          cp .github/release-assets.md release/README.txt
          ( cd release && sha256sum ./*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: Compose release body
        id: body
        run: |
          version=${GITHUB_REF#refs/tags/v}
          {
            awk "/## \[$version\]/,/## \[/{if (!/## \[/) print}" CHANGELOG.md
            echo
            cat .github/release-assets.md
          } > "$RUNNER_TEMP/body.md"
          {
            echo "body<<DC_BODY_EOF"
            cat "$RUNNER_TEMP/body.md"
            echo "DC_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/README.txt
            release/SHA256SUMS.txt
          body: ${{ steps.body.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
