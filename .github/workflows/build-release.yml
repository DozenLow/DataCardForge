name: Build and Release Executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        type: choice
        description: 'Select platform(s) to build'
        default: 'all'
        options:
          - all
          - linux-only
          - macos-only
          - windows-only
      build_type:
        type: choice
        description: 'Build type'
        default: 'Release'
        options:
          - Release
          - Debug
          - both

permissions:
  contents: read

concurrency:
  # A branch that is pushed twice must not queue the old commit's six builds.
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    # The packaged experience is binary + web/ in one zip, so the front end is built here
    # rather than asking the user to install Node.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build front end
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build-linux-fullperformance:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'linux')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libeigen3-dev

      - name: Configure backend (Release)
        run: >
          cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build backend
        run: cmake --build backend/build --config Release

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Check runtime dependencies
        run: ldd backend/build/dc_backend || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: datacardforge-linux-fullperformance
          path: backend/build/dc_backend
          if-no-files-found: error

  build-linux-debug:
    runs-on: ubuntu-latest
    # Debug exists so a user can hand back a build that stops at the first violated contract.
    # That job does not need to gate every commit — tags are enough.
    if: |
      (github.event_name != 'workflow_dispatch' ||
       contains(github.event.inputs.platforms, 'all') ||
       contains(github.event.inputs.platforms, 'linux')) &&
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libeigen3-dev

      - name: Configure backend (Debug)
        run: cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build backend
        run: cmake --build backend/build --config Debug

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: datacardforge-linux-debug
          path: backend/build/dc_backend
          if-no-files-found: error

  build-macos-fullperformance:
    runs-on: macos-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'macos')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: brew install cmake ninja eigen@3

      - name: Configure backend (Release)
        run: cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix eigen@3)"

      - name: Build backend
        run: cmake --build backend/build --config Release

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: datacardforge-macos-fullperformance
          path: backend/build/dc_backend
          if-no-files-found: error

  build-macos-debug:
    runs-on: macos-latest
    if: |
      (github.event_name != 'workflow_dispatch' ||
       contains(github.event.inputs.platforms, 'all') ||
       contains(github.event.inputs.platforms, 'macos')) &&
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: brew install cmake ninja eigen@3

      - name: Configure backend (Debug)
        run: cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$(brew --prefix eigen@3)"

      - name: Build backend
        run: cmake --build backend/build --config Debug

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: datacardforge-macos-debug
          path: backend/build/dc_backend
          if-no-files-found: error

  build-windows-fullperformance:
    runs-on: windows-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'windows')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install cmake and ninja
        run: choco install cmake ninja -y

      - name: Install Eigen
        run: |
          vcpkg install eigen3:x64-windows
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = $env:VCPKG_ROOT }
          if (-not $vcpkgRoot) { $vcpkgRoot = Split-Path -Parent (Get-Command vcpkg).Source }
          echo "CMAKE_TOOLCHAIN_FILE=$vcpkgRoot\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure backend (Release)
        # No -DCMAKE_MSVC_RUNTIME_LIBRARY here: this job compiles with MinGW, not MSVC, and that
        # knob is silently ignored there — which is how "the runtime is linked statically" ended up
        # true only in the docs while the exe kept importing libstdc++-6.dll. The runtime is made
        # self-contained in backend/CMakeLists.txt (`-static`), and the import check below enforces it.
        run: cmake -S backend -B backend/build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${{ env.CMAKE_TOOLCHAIN_FILE }}"

      - name: Build backend
        run: cmake --build backend/build --config Release

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Verify the exe imports no MinGW runtime DLLs
        shell: bash
        run: |
          set -euo pipefail
          # Take objdump from the MinGW CMake actually used, not from PATH blindly.
          cxx="$(grep -m1 '^CMAKE_CXX_COMPILER:FILEPATH=' backend/build/CMakeCache.txt | cut -d= -f2 | tr '\\' '/')"
          objdump="$(dirname "$cxx")/objdump.exe"
          [ -x "$objdump" ] || objdump="$(command -v objdump)"
          deps="$("$objdump" -p backend/build/dc_backend.exe | awk '/DLL Name/ {print $3}')"
          echo "imports:"; echo "$deps"
          # A release user has none of these; a stale copy found on PATH is exactly what
          # "procedure entry point ... could not be located in dc_backend.exe" looks like.
          if printf '%s\n' "$deps" | grep -Ei '^(libstdc\+\+-6|libgcc_s_(seh|dw2)-1|libwinpthread-1|libssp-0)\.dll$'; then
            echo "::error::the exe still imports the MinGW runtime - it will not start on a clean Windows machine"
            exit 1
          fi
          # And prove it: run the exe with MinGW stripped from PATH, which is what a user's
          # machine looks like. --help exits 0 as soon as the image has loaded.
          tmp="$(mktemp -d)"
          cp backend/build/dc_backend.exe "$tmp/"
          env PATH="/c/Windows/system32:/c/Windows" "$tmp/dc_backend.exe" --help >/dev/null
          echo "clean-PATH smoke run: ok"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: datacardforge-windows-fullperformance
          path: backend/build/dc_backend.exe
          if-no-files-found: error

  build-windows-debug:
    runs-on: windows-latest
    if: |
      (github.event_name != 'workflow_dispatch' ||
       contains(github.event.inputs.platforms, 'all') ||
       contains(github.event.inputs.platforms, 'windows')) &&
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install cmake and ninja
        run: choco install cmake ninja -y

      - name: Install Eigen
        run: |
          vcpkg install eigen3:x64-windows
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = $env:VCPKG_ROOT }
          if (-not $vcpkgRoot) { $vcpkgRoot = Split-Path -Parent (Get-Command vcpkg).Source }
          echo "CMAKE_TOOLCHAIN_FILE=$vcpkgRoot\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure backend (Debug)
        run: cmake -S backend -B backend/build -G "Ninja" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE="${{ env.CMAKE_TOOLCHAIN_FILE }}"

      - name: Build backend
        run: cmake --build backend/build --config Debug

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Verify the exe imports no MinGW runtime DLLs
        shell: bash
        run: |
          set -euo pipefail
          # Take objdump from the MinGW CMake actually used, not from PATH blindly.
          cxx="$(grep -m1 '^CMAKE_CXX_COMPILER:FILEPATH=' backend/build/CMakeCache.txt | cut -d= -f2 | tr '\\' '/')"
          objdump="$(dirname "$cxx")/objdump.exe"
          [ -x "$objdump" ] || objdump="$(command -v objdump)"
          deps="$("$objdump" -p backend/build/dc_backend.exe | awk '/DLL Name/ {print $3}')"
          echo "imports:"; echo "$deps"
          if printf '%s\n' "$deps" | grep -Ei '^(libstdc\+\+-6|libgcc_s_(seh|dw2)-1|libwinpthread-1|libssp-0)\.dll$'; then
            echo "::error::the exe still imports the MinGW runtime - it will not start on a clean Windows machine"
            exit 1
          fi
          # And prove it: run the exe with MinGW stripped from PATH, which is what a user's
          # machine looks like. --help exits 0 as soon as the image has loaded.
          tmp="$(mktemp -d)"
          cp backend/build/dc_backend.exe "$tmp/"
          env PATH="/c/Windows/system32:/c/Windows" "$tmp/dc_backend.exe" --help >/dev/null
          echo "clean-PATH smoke run: ok"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: datacardforge-windows-debug
          path: backend/build/dc_backend.exe
          if-no-files-found: error

  build-linux-standard:
    # The recommended download: optimized (-O2) with NDEBUG left undefined, so Eigen's
    # assertions stay on. Same binary the tests measure, minus the "silently wrong number".
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'linux')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libeigen3-dev

      - name: Configure backend (Asserts)
        run: >
          cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Asserts
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build backend
        run: cmake --build backend/build

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: datacardforge-linux-standard
          path: backend/build/dc_backend
          if-no-files-found: error

  build-macos-standard:
    runs-on: macos-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'macos')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: brew install cmake ninja eigen@3

      - name: Configure backend (Asserts)
        run: cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Asserts -DCMAKE_PREFIX_PATH="$(brew --prefix eigen@3)"

      - name: Build backend
        run: cmake --build backend/build

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: datacardforge-macos-standard
          path: backend/build/dc_backend
          if-no-files-found: error

  build-windows-standard:
    runs-on: windows-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'windows')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install cmake and ninja
        run: choco install cmake ninja -y

      - name: Install Eigen
        run: |
          vcpkg install eigen3:x64-windows
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = $env:VCPKG_ROOT }
          if (-not $vcpkgRoot) { $vcpkgRoot = Split-Path -Parent (Get-Command vcpkg).Source }
          echo "CMAKE_TOOLCHAIN_FILE=$vcpkgRoot\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure backend (Asserts)
        # MinGW job: -DCMAKE_MSVC_RUNTIME_LIBRARY would be ignored here (see the Release job).
        run: cmake -S backend -B backend/build -G "Ninja" -DCMAKE_BUILD_TYPE=Asserts -DCMAKE_TOOLCHAIN_FILE="${{ env.CMAKE_TOOLCHAIN_FILE }}"

      - name: Build backend
        run: cmake --build backend/build

      - name: Run tests
        run: ctest --test-dir backend/build --output-on-failure

      - name: Verify the exe imports no MinGW runtime DLLs
        shell: bash
        run: |
          set -euo pipefail
          # Take objdump from the MinGW CMake actually used, not from PATH blindly.
          cxx="$(grep -m1 '^CMAKE_CXX_COMPILER:FILEPATH=' backend/build/CMakeCache.txt | cut -d= -f2 | tr '\\' '/')"
          objdump="$(dirname "$cxx")/objdump.exe"
          [ -x "$objdump" ] || objdump="$(command -v objdump)"
          deps="$("$objdump" -p backend/build/dc_backend.exe | awk '/DLL Name/ {print $3}')"
          echo "imports:"; echo "$deps"
          if printf '%s\n' "$deps" | grep -Ei '^(libstdc\+\+-6|libgcc_s_(seh|dw2)-1|libwinpthread-1|libssp-0)\.dll$'; then
            echo "::error::the exe still imports the MinGW runtime - it will not start on a clean Windows machine"
            exit 1
          fi
          # And prove it: run the exe with MinGW stripped from PATH, which is what a user's
          # machine looks like. --help exits 0 as soon as the image has loaded.
          tmp="$(mktemp -d)"
          cp backend/build/dc_backend.exe "$tmp/"
          env PATH="/c/Windows/system32:/c/Windows" "$tmp/dc_backend.exe" --help >/dev/null
          echo "clean-PATH smoke run: ok"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: datacardforge-windows-standard
          path: backend/build/dc_backend.exe
          if-no-files-found: error

  release:
    needs:
      - build-web
      - build-linux-standard
      - build-linux-fullperformance
      - build-linux-debug
      - build-macos-standard
      - build-macos-fullperformance
      - build-macos-debug
      - build-windows-standard
      - build-windows-fullperformance
      - build-windows-debug
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `gh run download` instead of actions/download-artifact: that action still runs on
          # the deprecated node20 runtime, and the gh CLI is preinstalled on the runner.
          gh run download "$GITHUB_RUN_ID" -D artifacts -R "$GITHUB_REPOSITORY"

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in artifacts/*/; do
            dir_name="$(basename "$dir")"
            [ "$dir_name" = "web-dist" ] && continue
            bin=""
            exe="datacardforge"
            [ -f "$dir/dc_backend" ] && bin="$dir/dc_backend"
            [ -f "$dir/dc_backend.exe" ] && { bin="$dir/dc_backend.exe"; exe="datacardforge.exe"; }
            [ -n "$bin" ] || continue
            # The CMake target is still `dc_backend` (the systemd unit and local build dirs
            # depend on that path); the *shipped* executable is the product name.
            stage="$RUNNER_TEMP/stage/$dir_name"
            rm -rf "$stage"
            mkdir -p "$stage/web"
            cp "$bin" "$stage/$exe"
            cp -r artifacts/web-dist/. "$stage/web/"
            ( cd "$stage" && zip -q -r "$GITHUB_WORKSPACE/release/${dir_name}.zip" . )
          done
          cp .github/release-assets.md release/README.txt
          ( cd release && sha256sum ./*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: Compose release body
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          # Bilingual by default: two collapsed <details> blocks, Chinese first.
          python3 scripts/compose-release-notes.py --version "$version" \
            --en-changelog CHANGELOG.md --zh-changelog CHANGELOG.zh-CN.md \
            --assets .github/release-assets.md --out "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # gh instead of softprops/action-gh-release: same node20 reason as above.
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/body.md"
          gh release upload "$tag" release/*.zip release/README.txt release/SHA256SUMS.txt --clobber
