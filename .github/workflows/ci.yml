name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    # Ubuntu image is pinned across every workflow: a re-pointed label silently changes the
    # toolchain a green gate was earned on.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-unit.json"

      - name: Upload unit test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-unit
          path: ${{ runner.temp }}/vitest-unit.json

      - name: Production build
        run: npm run build

  backend-test:
    # Pinned rather than `ubuntu-latest`: that label is migrating to a new Ubuntu release, and a
    # flip moves the compiler and the apt mirror underneath a green pipeline. In run #32 every
    # Linux job failed after ~9 min while the macOS/Windows jobs built the same commit cleanly;
    # the only work those failed jobs shared was the apt-based toolchain install.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install C++ toolchain
        run: |
          # Retries: a single mirror 5xx used to abort the whole job, and the resulting exit code
          # was indistinguishable from a compiler error in the run summary.
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libeigen3-dev

      - name: Provision required Python runtime
        uses: ./.github/actions/python-runtime

      - name: Configure & build backend
        run: |
          cmake -S backend -B backend/build -G Ninja
          cmake --build backend/build

      - name: Test CI report checks
        run: python3 scripts/test-ci-test-report.py

      - name: Run CTest and verify required Python coverage
        run: |
          ctest --test-dir backend/build --no-tests=error --output-on-failure --output-junit "$RUNNER_TEMP/ctest.xml"
          python3 scripts/check-ci-test-report.py ctest "$RUNNER_TEMP/ctest.xml"

      - name: Upload CTest report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-ctest
          path: ${{ runner.temp }}/ctest.xml

  # A change that only compiles on Linux is not a verified change. `build-release.yml` compiles
  # macOS and Windows on tags only, so the first time the other two platforms see new code is
  # after the version has been cut — which is how 0.1.4 shipped a `std::filesystem::path` →
  # `std::string` conversion that does not exist on Windows (path::string_type is wstring).
  #
  # These jobs build and stop. The test suite needs a POSIX-provisioned Python runtime
  # (third_party/ is git-ignored and `scripts/fetch-python-runtime.sh` is bash + a linux wheel);
  # what was missing here is the compile, and a compile gate is what these two are.
  windows-compile:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install cmake and ninja
        run: choco install cmake ninja -y

      - name: Install Eigen
        run: |
          vcpkg install eigen3:x64-windows
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = $env:VCPKG_ROOT }
          if (-not $vcpkgRoot) { $vcpkgRoot = Split-Path -Parent (Get-Command vcpkg).Source }
          echo "CMAKE_TOOLCHAIN_FILE=$vcpkgRoot\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure & build
        # Same generator, toolchain and build type as build-windows-* in build-release.yml, so a
        # green gate here predicts a green release build rather than merely "some compiler".
        run: |
          cmake -S backend -B backend/build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${{ env.CMAKE_TOOLCHAIN_FILE }}"
          cmake --build backend/build --config Release

  macos-compile:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: brew install cmake ninja eigen@3

      - name: Configure & build
        run: |
          cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix eigen@3)"
          cmake --build backend/build --config Release

  e2e-smoke:
    runs-on: ubuntu-24.04
    needs: typecheck-and-test
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The smoke run exercises the *real* compute backend (summary panel, formula
      # cards), so the C++ binary has to exist here too. Without it those checks would
      # only ever prove the "backend unreachable" banner renders.
      - name: Install C++ toolchain
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libeigen3-dev

      - name: Provision required Python runtime
        uses: ./.github/actions/python-runtime

      - name: Build compute backend
        working-directory: .
        run: |
          cmake -S backend -B backend/build -G Ninja
          cmake --build backend/build --target dc_backend

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Live backend integration and Chromium smoke
        env:
          DC_RUN_INTEGRATION: '1'
          DC_BACKEND_URL: http://127.0.0.1:37811/api
          XDG_CONFIG_HOME: ${{ runner.temp }}/dc-ci-config
        run: |
          ../backend/build/dc_backend --port 37811 --no-open > "$RUNNER_TEMP/dc_backend.log" 2>&1 &
          backend_pid=$!
          preview_pid=''
          cleanup() {
            if [ -n "$preview_pid" ]; then
              kill "$preview_pid" 2>/dev/null || true
              wait "$preview_pid" 2>/dev/null || true
            fi
            kill "$backend_pid" 2>/dev/null || true
            wait "$backend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 "$DC_BACKEND_URL/hello" > /dev/null
          kill -0 "$backend_pid"
          npm test -- tests/backendIntegration.test.ts tests/xlayerGoldenFrames.test.ts \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-live.json"
          python3 ../scripts/check-ci-test-report.py vitest "$RUNNER_TEMP/vitest-live.json"
          NODE_ENV=production node node_modules/vite/bin/vite.js preview --port 4173 --strictPort \
            > "$RUNNER_TEMP/vite-preview.log" 2>&1 &
          preview_pid=$!
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/ > /dev/null
          kill -0 "$preview_pid"
          node scripts/smoke.mjs http://127.0.0.1:4173

      - name: Upload live test report and backend log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-backend-integration
          path: |
            ${{ runner.temp }}/vitest-live.json
            ${{ runner.temp }}/dc_backend.log
            ${{ runner.temp }}/vite-preview.log
            web/smoke-report.txt

  docs-check:
    # Docs are long-lived design records: navigation coverage, dead links, leftover ASCII
    # diagrams, orphaned SVGs and bilingual pairing are all mechanically decidable, so they
    # get a gate instead of a note in a file nobody re-reads (scripts/docs-check.py).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check docs invariants
        run: python3 scripts/docs-check.py
